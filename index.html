<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1a73e8">
  <title>Cash Expense Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-top">
        <h1>💰 Expense Tracker</h1>
        <div class="header-actions">
          <select id="currencySelect" class="currency-select" title="Select currency">
            <option value="USD">🇺🇸 USD</option>
            <option value="EUR">🇪🇺 EUR</option>
            <option value="GBP">🇬🇧 GBP</option>
            <option value="INR">🇮🇳 INR</option>
            <option value="JPY">🇯🇵 JPY</option>
            <option value="CAD">🇨🇦 CAD</option>
            <option value="AUD">🇦🇺 AUD</option>
            <option value="CNY">🇨🇳 CNY</option>
            <option value="BRL">🇧🇷 BRL</option>
            <option value="KRW">🇰🇷 KRW</option>
          </select>
          <button id="themeToggle" class="icon-btn" title="Toggle dark mode">🌙</button>
        </div>
      </div>
      <p class="subtitle">Track your cash spending</p>
    </header>

    <!-- Summary Cards -->
    <section class="summary">
      <div class="card card-total">
        <span class="card-label">Total Spent</span>
        <span class="card-value" id="totalAmount">$0.00</span>
        <span class="card-sub" id="totalMonth">This month: $0.00</span>
      </div>
      <div class="card card-count">
        <span class="card-label">Transactions</span>
        <span class="card-value" id="transactionCount">0</span>
        <span class="card-sub" id="avgPerDay">Avg/day: $0.00</span>
      </div>
    </section>

    <!-- Budget Section -->
    <section class="budget-section" id="budgetSection">
      <div class="budget-header">
        <span>Monthly Budget</span>
        <button id="editBudgetBtn" class="btn-small">Edit</button>
      </div>
      <div class="budget-bar-container">
        <div class="budget-bar" id="budgetBar"></div>
      </div>
      <div class="budget-labels">
        <span id="budgetSpent">$0.00 spent</span>
        <span id="budgetRemaining">$0.00 remaining</span>
      </div>
    </section>

    <!-- Category Breakdown -->
    <section class="category-section">
      <h2>Spending by Category</h2>
      <div id="categoryBreakdown" class="category-breakdown">
        <!-- Category bars rendered here -->
      </div>
    </section>

    <!-- Add/Edit Expense Form -->
    <section class="form-section">
      <h2 id="formTitle">Add Expense</h2>
      <form id="expenseForm">
        <input type="hidden" id="editId">
        <div class="form-row">
          <div class="form-group">
            <label for="amount">Amount</label>
            <div class="amount-input-wrapper">
              <span class="currency-symbol" id="currencySymbol">$</span>
              <input type="number" id="amount" step="0.01" min="0.01" placeholder="0.00" required inputmode="decimal">
            </div>
          </div>
          <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" required>
          </div>
        </div>
        <div class="form-group">
          <label for="category">Category</label>
          <div class="category-grid" id="categoryGrid">
            <button type="button" class="category-btn" data-value="food">🍔<span>Food</span></button>
            <button type="button" class="category-btn" data-value="transport">🚗<span>Transport</span></button>
            <button type="button" class="category-btn" data-value="shopping">🛍️<span>Shopping</span></button>
            <button type="button" class="category-btn" data-value="bills">📄<span>Bills</span></button>
            <button type="button" class="category-btn" data-value="entertainment">🎬<span>Fun</span></button>
            <button type="button" class="category-btn" data-value="health">💊<span>Health</span></button>
            <button type="button" class="category-btn" data-value="education">📚<span>Education</span></button>
            <button type="button" class="category-btn" data-value="other">📦<span>Other</span></button>
          </div>
          <input type="hidden" id="category" required>
        </div>
        <div class="form-group">
          <label for="description">Description</label>
          <input type="text" id="description" placeholder="What did you spend on?" maxlength="100">
        </div>
        <div class="form-group">
          <label for="paymentMethod">Payment Method</label>
          <select id="paymentMethod">
            <option value="cash">💵 Cash</option>
            <option value="card">💳 Card</option>
            <option value="upi">📱 UPI</option>
            <option value="bank">🏦 Bank Transfer</option>
            <option value="other">📦 Other</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submitBtn">Add Expense</button>
          <button type="button" class="btn btn-secondary" id="cancelEditBtn" style="display:none;">Cancel</button>
        </div>
      </form>
    </section>

    <!-- Search & Filter -->
    <section class="filter-section">
      <div class="filter-row">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="🔍 Search expenses...">
        </div>
        <select id="filterCategory">
          <option value="all">All Categories</option>
          <option value="food">🍔 Food</option>
          <option value="transport">🚗 Transport</option>
          <option value="shopping">🛍️ Shopping</option>
          <option value="bills">📄 Bills</option>
          <option value="entertainment">🎬 Entertainment</option>
          <option value="health">💊 Health</option>
          <option value="education">📚 Education</option>
          <option value="other">📦 Other</option>
        </select>
        <select id="filterTime">
          <option value="all">All Time</option>
          <option value="today">Today</option>
          <option value="week">This Week</option>
          <option value="month">This Month</option>
          <option value="lastmonth">Last Month</option>
        </select>
        <select id="sortBy">
          <option value="newest">Newest First</option>
          <option value="oldest">Oldest First</option>
          <option value="highest">Highest Amount</option>
          <option value="lowest">Lowest Amount</option>
        </select>
      </div>
    </section>

    <!-- Expense List -->
    <section class="expense-list" id="expenseList">
      <!-- Expenses rendered here -->
    </section>

    <!-- Empty State -->
    <div class="empty-state" id="emptyState">
      <p class="empty-icon">📝</p>
      <p>No expenses yet. Add your first one above!</p>
    </div>

    <!-- Export & Clear -->
    <section class="actions-section">
      <button id="exportBtn" class="btn btn-outline">📥 Export CSV</button>
      <button id="clearAllBtn" class="btn btn-danger-outline">🗑️ Clear All</button>
    </section>

    <!-- Toast -->
    <div class="toast" id="toast"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
